<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le quiz — Dans quel camp es-tu ?</title>
<meta name="description" content="17 questions pour ou contre, comparées aux votes réels de l'Assemblée nationale.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="wrap">
  <section id="quiz">
    <div id="quiz-header">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-label"><span id="progress-text">Question 1 / 17</span><span id="progress-pct">0%</span></div>
    </div>
    <div class="q-card">
      <p class="q-eyebrow">Pour ou contre ?</p>
      <h2 id="q-text"></h2>
      <p class="q-sub" id="q-sub"></p>
      <div class="choices">
        <button class="choice-btn" data-v="pour"><span>Pour</span><span class="tag">P</span></button>
        <button class="choice-btn" data-v="contre"><span>Contre</span><span class="tag">C</span></button>
        <button class="choice-btn" data-v="sans_avis"><span>Je ne sais pas</span><span class="tag">—</span></button>
      </div>
      <details class="scrutin-ref">
        <summary>Voir le vote réel correspondant</summary>
        <div class="scrutin-detail" id="scrutin-detail"></div>
      </details>
    </div>
    <div class="quiz-nav">
      <button class="nav-btn" id="btn-prev">← Précédent</button>
      <button class="nav-btn visible-link" id="btn-next" disabled>Suivant →</button>
    </div>
  </section>
</div>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/quiz.js"></script>
<script>renderHeader('quiz');</script>
</body>
</html>
